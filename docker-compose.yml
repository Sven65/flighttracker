services:
  flighttracker:
    build: .
    container_name: flighttracker
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DB_DRIVER: sqlite
      SQLITE_PATH: /app/data/flighttracker.db
      # Change to a long random string before deploying
      SESSION_SECRET: change-this-to-something-long-and-random
      PORT: 3000
      BCRYPT_SALT_ROUNDS: 12
      # See .env.example
      REQUIRE_INVITE: "true"
      TRUST_PROXY: "false"
      # Optional - see .env.example
      AERODATABOX_API_KEY: ""
    volumes:
      - ./data:/app/data
